<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click Analyzer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e2330;
      --line: rgba(255, 255, 255, 0.10);
      --text: #f3f4f8;
      --muted: #9aa4b2;
      --accent: #f6a04d;
      --accent-2: #8bd3ff;
      --danger: #ff6b6b;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(246, 160, 77, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(139, 211, 255, 0.12), transparent 28%),
        linear-gradient(180deg, #11141b 0%, #0d0f13 100%);
      color: var(--text);
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      justify-content: space-between;
      padding: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
      color: var(--accent-2);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 0;
      max-width: 70ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button,
    .style-button,
    .sample-button {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
      color: var(--text);
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .button:hover,
    .style-button:hover,
    .sample-button:hover {
      transform: translateY(-1px);
      border-color: rgba(246, 160, 77, 0.5);
    }

    .button {
      padding: 12px 16px;
      font-weight: 700;
    }

    .button.danger {
      border-color: rgba(255, 107, 107, 0.35);
    }

    .volume {
      display: grid;
      gap: 6px;
      min-width: 220px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .volume-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 18px;
    }

    .sidebar,
    .content {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .sidebar {
      padding: 14px;
      position: sticky;
      top: 18px;
      align-self: start;
      max-height: calc(100vh - 36px);
      overflow: auto;
    }

    .sidebar-title,
    .section-title {
      margin: 0 0 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .style-list {
      display: grid;
      gap: 10px;
    }

    .style-button {
      width: 100%;
      text-align: left;
      padding: 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .style-button small {
      color: var(--muted);
      font-weight: 600;
    }

    .style-button.active {
      border-color: rgba(246, 160, 77, 0.7);
      background: linear-gradient(180deg, rgba(246,160,77,0.22), rgba(255,255,255,0.04));
      box-shadow: inset 0 0 0 1px rgba(246,160,77,0.08);
    }

    .content {
      padding: 20px;
      min-width: 0;
    }

    .status {
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .category-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .category-name {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .category-desc {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 70ch;
      font-size: 14px;
      line-height: 1.5;
    }

    .sample-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .sample-button {
      min-height: 110px;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 8px;
      text-align: left;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03)),
        radial-gradient(circle at top right, rgba(246,160,77,0.08), transparent 55%);
    }

    .sample-role {
      font-size: 17px;
      font-weight: 800;
    }

    .sample-file {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      word-break: break-all;
    }

    .sample-tag {
      display: inline-flex;
      align-self: start;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(139, 211, 255, 0.12);
      border: 1px solid rgba(139, 211, 255, 0.18);
      color: var(--accent-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 980px) {
      .hero {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        top: 0;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Click Analyzer</p>
        <h1>Reproduce los audios de click por categoria</h1>
        <p class="subtitle">
          Usa esta pagina para comparar timbres, volumen percibido y ataque entre
          las categorias. Los archivos viven en <code>assets/clicks/samples</code>.
        </p>
      </div>

      <div class="toolbar">
        <div class="volume">
          <div class="volume-row">
            <span>Volumen</span>
            <strong id="volumeLabel">100%</strong>
          </div>
          <input id="volume" type="range" min="0" max="100" value="100" />
        </div>
        <button class="button danger" id="stopAll">Detener todo</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <p class="sidebar-title">Categorias</p>
        <div class="style-list" id="styleList"></div>
      </aside>

      <section class="content">
        <div class="status" id="status">Selecciona una categoria y reproduce uno de sus audios.</div>
        <div class="category-head">
          <div>
            <h2 class="category-name" id="categoryName">Classic</h2>
            <p class="category-desc" id="categoryDesc"></p>
          </div>
        </div>
        <div class="sample-grid" id="sampleGrid"></div>
      </section>
    </main>
  </div>

  <script>
    const ASSET_BASE = './samples';
    const ROLE_LABELS = {
      accents: 'Accents',
      quarter: 'Quarter',
      eighth: 'Eighth',
      sixteenth: 'Sixteenth',
    };

    const CATEGORIES = [
      {
        id: 'classic',
        name: 'Classic',
        description: 'Sonido estable, definido y facil de usar como referencia base.',
        samples: ['accents', 'quarter', 'eighth', 'sixteenth'],
      },
      {
        id: 'woodblock',
        name: 'Woodblock',
        description: 'Ataque mas seco y percutivo, util para comparar claridad.',
        samples: ['accents', 'quarter', 'eighth', 'sixteenth'],
      },
      {
        id: 'cowbell',
        name: 'Cowbell',
        description: 'Mas brillante y cortante; ayuda a revisar presencia en mezcla.',
        samples: ['accents', 'quarter', 'eighth', 'sixteenth'],
      },
      {
        id: 'digital',
        name: 'Digital',
        description: 'Timbre sintetico y mas limpio. En este pack solo hay accents y sixteenth.',
        samples: ['accents', 'sixteenth'],
      },
      {
        id: 'gentle',
        name: 'Gentle',
        description: 'Mas suave y redondeado, con menos agresividad en el ataque.',
        samples: ['accents', 'quarter', 'eighth', 'sixteenth'],
      },
      {
        id: 'percussive',
        name: 'Percussive',
        description: 'Mas firme y marcado. Sirve para probar cuanto corta en monitoreo.',
        samples: ['accents', 'quarter', 'eighth', 'sixteenth'],
      },
      {
        id: 'saw',
        name: 'Saw',
        description: 'Timbre mas agudo y con borde mas sintético.',
        samples: ['accents', 'quarter', 'eighth'],
      },
      {
        id: 'blip',
        name: 'Blip',
        description: 'Clic compacto, rapido y util si buscas un ataque menos pesado.',
        samples: ['accents', 'quarter', 'eighth', 'sixteenth'],
      },
    ];

    const audioCache = new Map();
    let activeCategoryId = 'classic';
    let globalVolume = 1.0;
    let currentAudio = null;

    const styleList = document.getElementById('styleList');
    const sampleGrid = document.getElementById('sampleGrid');
    const categoryName = document.getElementById('categoryName');
    const categoryDesc = document.getElementById('categoryDesc');
    const status = document.getElementById('status');
    const volume = document.getElementById('volume');
    const volumeLabel = document.getElementById('volumeLabel');

    function setStatus(text) {
      status.textContent = text;
    }

    function getCategory(id) {
      return CATEGORIES.find((entry) => entry.id === id) || CATEGORIES[0];
    }

    function samplePath(styleId, role) {
      return `${ASSET_BASE}/click-${styleId}-${role}.wav`;
    }

    function getAudio(styleId, role) {
      const key = `${styleId}:${role}`;
      if (!audioCache.has(key)) {
        const audio = new Audio(samplePath(styleId, role));
        audio.preload = 'auto';
        audio.load();
        audio.addEventListener('error', () => {
          setStatus(`Error cargando ${samplePath(styleId, role)}.`);
        });
        audioCache.set(key, audio);
      }
      const audio = audioCache.get(key);
      audio.volume = globalVolume;
      return audio;
    }

    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    function stopAll() {
      stopCurrentAudio();
      for (const audio of audioCache.values()) {
        audio.pause();
        audio.currentTime = 0;
      }
      setStatus('Audio detenido.');
    }

    function playSample(styleId, role) {
      stopCurrentAudio();
      const audio = getAudio(styleId, role);
      audio.currentTime = 0;
      audio.volume = globalVolume;
      audio.onended = () => {
        if (currentAudio === audio)
          currentAudio = null;
        setStatus(`Finalizo ${getCategory(styleId).name} / ${ROLE_LABELS[role] || role}`);
      };
      currentAudio = audio;
      setStatus(`Reproduciendo ${getCategory(styleId).name} / ${ROLE_LABELS[role] || role}`);
      audio.load();
      audio.play().catch((err) => {
        setStatus(`No se pudo reproducir ${samplePath(styleId, role)}: ${err.message}`);
      });
    }

    function primeSamples() {
      for (const category of CATEGORIES) {
        for (const role of category.samples) {
          const audio = getAudio(category.id, role);
          audio.preload = 'auto';
          audio.load();
        }
      }
    }

    function renderStyles() {
      styleList.innerHTML = '';
      for (const category of CATEGORIES) {
        const btn = document.createElement('button');
        btn.className = `style-button${category.id === activeCategoryId ? ' active' : ''}`;
        btn.type = 'button';
        btn.innerHTML = `
          <span>${category.name}</span>
          <small>${category.samples.length} sonidos</small>
        `;
        btn.addEventListener('click', () => {
          stopAll();
          activeCategoryId = category.id;
          render();
        });
        styleList.appendChild(btn);
      }
    }

    function renderSamples() {
      const category = getCategory(activeCategoryId);
      categoryName.textContent = category.name;
      categoryDesc.textContent = category.description;
      sampleGrid.innerHTML = '';

      for (const role of category.samples) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'sample-button';
        card.innerHTML = `
          <span class="sample-tag">${ROLE_LABELS[role] || role}</span>
          <span class="sample-role">${ROLE_LABELS[role] || role}</span>
          <span class="sample-file">${samplePath(category.id, role)}</span>
        `;
        card.addEventListener('click', () => playSample(category.id, role));
        sampleGrid.appendChild(card);
      }
    }

    function render() {
      renderStyles();
      renderSamples();
    }

    document.getElementById('stopAll').addEventListener('click', stopAll);
    volume.addEventListener('input', (event) => {
      globalVolume = Number(event.target.value) / 100.0;
      volumeLabel.textContent = `${event.target.value}%`;
      for (const audio of audioCache.values())
        audio.volume = globalVolume;
      if (currentAudio)
        currentAudio.volume = globalVolume;
    });

    primeSamples();
    render();
  </script>
</body>
</html>
