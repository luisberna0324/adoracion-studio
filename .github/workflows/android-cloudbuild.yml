name: Build Android on Google Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-cloudbuild
  cancel-in-progress: false

jobs:
  build-android:
    name: Compile Android APK in Cloud Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1
      - uses: google-github-actions/auth@v3
        with:
          project_id: play-worship
          workload_identity_provider: projects/534620374374/locations/global/workloadIdentityPools/github-actions/providers/playworship
          service_account: playworship-github-actions@play-worship.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Submit Android build to Cloud Build
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(gcloud builds submit . \
            --project=play-worship \
            --region=us-central1 \
            --config=ci/cloudbuild-android.yaml \
            --service-account=projects/play-worship/serviceAccounts/playworship-cloudbuild-runner@play-worship.iam.gserviceaccount.com \
            --gcs-source-staging-dir=gs://play-worship-github-cloudbuild/source \
            --async \
            --format='value(id)')"
          test -n "${BUILD_ID}"
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          for attempt in $(seq 1 120); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project=play-worship --region=us-central1 --format='value(status)')"
            case "${STATUS}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build ${BUILD_ID} terminó con estado ${STATUS}." >&2
                echo "Logs: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=play-worship" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Cloud Build ${BUILD_ID} excedió el tiempo de espera del workflow." >&2
          exit 1
      - name: Download APK from Cloud Storage
        run: |
          mkdir -p dist
          gcloud storage cp \
            "gs://play-worship-github-cloudbuild/artifacts/${{ steps.submit.outputs.build_id }}/app-debug.apk" \
            dist/playworship-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: playworship-android-gcp-${{ github.sha }}
          path: dist/playworship-android-debug.apk
          if-no-files-found: error
          retention-days: 14
