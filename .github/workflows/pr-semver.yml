name: PR SemVer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - closed

permissions:
  contents: read

jobs:
  semver-check:
    if: github.event.action != 'closed'
    name: Validate SemVer Policy 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute and validate SemVer for PR branch
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          scripts/semver.sh \
            --branch "${{ github.head_ref }}" \
            --sequence "${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --require-supported-branch

      - name: Publish SemVer summary
        shell: bash
        run: |
          {
            echo "## SemVer Preview"
            echo ""
            echo "- Source branch: \`${{ github.head_ref }}\`"
            echo "- Branch kind: \`${{ steps.semver.outputs.branch_kind }}\`"
            echo "- Last stable: \`${{ steps.semver.outputs.last_stable }}\`"
            echo "- Next stable: \`${{ steps.semver.outputs.next_stable }}\`"
            echo "- PR prerelease: \`${{ steps.semver.outputs.semver }}\`"
            echo "- Tag candidate: \`${{ steps.semver.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  create-tag-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    name: Create SemVer Tag On Merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute SemVer tag from merged PR branch
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          scripts/semver.sh \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --require-supported-branch

      - name: Create and push tag if missing
        id: create_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.semver.outputs.tag }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"

          git fetch --tags origin

          if git ls-remote --exit-code --refs --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Skipping."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${MERGE_SHA}" -m "Release ${TAG} (merged from ${PR_BRANCH})"
          git push origin "${TAG}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

      - name: Build installers for the new tag
        if: steps.create_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: gh workflow run ci.yml --ref "${TAG}" -f ref="${TAG}" -f release_kind=patch -f publish_release=true
