name: PR SemVer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: write

jobs:
  semver-check:
    name: Validate SemVer Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute and validate SemVer for PR branch
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          scripts/semver.sh \
            --branch "${{ github.head_ref }}" \
            --sequence "${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --require-supported-branch

      - name: Persist SemVer tag on origin
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.semver.outputs.tag }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          PR_BRANCH="${{ github.head_ref }}"

          git fetch --tags origin

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${PR_SHA}" -m "PR SemVer ${TAG} (${PR_BRANCH})"
          git push origin "${TAG}"

      - name: Publish SemVer summary
        shell: bash
        run: |
          {
            echo "## SemVer Preview"
            echo ""
            echo "- Source branch: \`${{ github.head_ref }}\`"
            echo "- Branch kind: \`${{ steps.semver.outputs.branch_kind }}\`"
            echo "- Last stable: \`${{ steps.semver.outputs.last_stable }}\`"
            echo "- Next stable: \`${{ steps.semver.outputs.next_stable }}\`"
            echo "- PR prerelease: \`${{ steps.semver.outputs.semver }}\`"
            echo "- Tag candidate: \`${{ steps.semver.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
