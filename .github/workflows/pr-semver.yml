name: PR SemVer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

jobs:
  semver-check:
    if: github.event.action != 'closed'
    name: Validate SemVer Policy 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute and validate SemVer for PR branch
        id: semver
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          scripts/semver.sh \
            --branch "${PR_BRANCH}" \
            --sequence "${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --require-supported-branch

      - name: Publish SemVer summary
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          {
            echo "## SemVer Preview"
            echo ""
            echo "- Source branch: \`${PR_BRANCH}\`"
            echo "- Branch kind: \`${{ steps.semver.outputs.branch_kind }}\`"
            echo "- Last stable: \`${{ steps.semver.outputs.last_stable }}\`"
            echo "- Next stable: \`${{ steps.semver.outputs.next_stable }}\`"
            echo "- PR prerelease: \`${{ steps.semver.outputs.semver }}\`"
            echo "- Tag candidate: \`${{ steps.semver.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
