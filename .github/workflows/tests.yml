name: Functional tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-resources:
    name: Android bundled resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure resource regression tests
        run: cmake -S tests/binary_resources -B build/binary-resources -G Ninja
      - name: Build resource regression tests
        run: cmake --build build/binary-resources --parallel 3
      - name: Verify bundled resource bytes and lookups
        run: ctest --test-dir build/binary-resources --output-on-failure --no-tests=error

  macos-ctest:
    name: CTest on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Bootstrap Bungee
        run: bash scripts/bootstrap_bungee.sh

      - name: Configure regression tests
        run: >-
          cmake -S . -B build/functional-tests -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DJUCE_DIR="${{ github.workspace }}/third_party/JUCE"
          -DMTCONTROLS_BUILD_TESTS=ON

      - name: Build regression tests
        run: cmake --build build/functional-tests --target PlayWorshipTests --parallel 3

      - name: Run regression tests
        run: ctest --test-dir build/functional-tests --output-on-failure --no-tests=error -LE 'interactive|lan'

  windows-build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-release
          - arch: x86
            preset: windows-x86-release
    steps:
      - uses: actions/checkout@v4

      - name: Create third_party directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path third_party

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Bootstrap Bungee SDK
        if: matrix.arch == 'x64'
        shell: bash
        run: bash scripts/bootstrap_bungee.sh

      - name: Configure Windows build
        env:
          JUCE_DIR: ${{ github.workspace }}\third_party\JUCE
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Windows plugin
        run: cmake --build --preset ${{ matrix.preset }} --target MTControls --parallel 3
