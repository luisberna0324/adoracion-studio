# Updated CI Configuration

name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JUCE
        run: |
          git clone --branch 8.1.0 https://github.com/juce-framework/JUCE.git

      - name: Build
        run: |
          cd JUCE
          ./build.sh
