name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o SHA para construir (si el tag existe, tiene prioridad)"
        required: true
        default: main
        type: string
      tag:
        description: "Tag semver opcional (ej: v1.2.3)"
        required: false
        default: ""
        type: string
      version:
        description: "Version semver opcional (ej: 1.2.3)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publicar GitHub Release con los artefactos"
        required: true
        default: false
        type: boolean
      publish_installers:
        description: "Generar/publicar instalador Linux (.deb). macOS (.pkg) y Windows (.exe) siempre se generan"
        required: true
        default: true
        type: boolean
      publish_to_downloads_repo:
        description: "Publicar release en repo publico de descargas (owner/repo)"
        required: true
        default: false
        type: boolean
      downloads_repo:
        description: "Repo destino para releases publicas (ej: tu-org/playworship-downloads)"
        required: false
        default: "luisberna0324/adoracion-studio-downloads"
        type: string
      create_tag_if_missing:
        description: "Crear y pushear tag en este repo si no existe"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  
concurrency:
  group: build-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      semver: ${{ steps.resolve.outputs.semver }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      publish_installers: ${{ steps.resolve.outputs.publish_installers }}
      target_release_repo: ${{ steps.resolve.outputs.target_release_repo }}
      create_tag_if_missing: ${{ steps.resolve.outputs.create_tag_if_missing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, tag and ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          strip_wrapping_quotes() {
            local value="$1"
            if [[ ${#value} -ge 2 ]]; then
              if [[ "${value}" == \"*\" && "${value}" == *\" ]]; then
                value="${value:1:${#value}-2}"
              elif [[ "${value}" == \'*\' && "${value}" == *\' ]]; then
                value="${value:1:${#value}-2}"
              fi
            fi
            printf '%s' "${value}"
          }

          normalize_version_input() {
            local raw="$1"
            raw="$(trim "${raw}")"
            raw="$(strip_wrapping_quotes "${raw}")"
            raw="${raw#refs/tags/}"
            if [[ "${raw}" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              printf '%s.%s.%s' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
              return 0
            fi
            return 1
          }

          normalize_tag_input() {
            local raw="$1"
            raw="$(trim "${raw}")"
            raw="$(strip_wrapping_quotes "${raw}")"
            raw="${raw#refs/tags/}"
            if [[ "${raw}" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              printf 'v%s.%s.%s' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
              return 0
            fi
            return 1
          }

          normalize_repo_input() {
            local raw="$1"
            raw="$(trim "${raw}")"
            raw="$(strip_wrapping_quotes "${raw}")"
            raw="${raw#https://github.com/}"
            raw="${raw#http://github.com/}"
            raw="${raw#github.com/}"
            raw="${raw%.git}"
            if [[ "${raw}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              printf '%s' "${raw}"
              return 0
            fi
            return 1
          }

          REF_INPUT="$(trim "${{ inputs.ref }}")"
          if [[ -z "${REF_INPUT}" ]]; then
            REF_INPUT="main"
          fi
          TAG_INPUT_RAW="$(trim "${{ inputs.tag }}")"
          VERSION_INPUT_RAW="$(trim "${{ inputs.version }}")"
          PUBLISH_INPUT="${{ inputs.publish_release }}"
          PUBLISH_INSTALLERS_INPUT="${{ inputs.publish_installers }}"
          PUBLISH_TO_DOWNLOADS_INPUT="${{ inputs.publish_to_downloads_repo }}"
          DOWNLOADS_REPO_RAW="$(trim "${{ inputs.downloads_repo }}")"
          CREATE_TAG_INPUT="${{ inputs.create_tag_if_missing }}"

          if [[ -z "${TAG_INPUT_RAW}" && -z "${VERSION_INPUT_RAW}" ]]; then
            echo "Debes indicar al menos 'tag' o 'version'." >&2
            exit 1
          fi

          if [[ -n "${TAG_INPUT_RAW}" ]]; then
            if ! TAG_FROM_INPUT="$(normalize_tag_input "${TAG_INPUT_RAW}")"; then
              echo "Tag invalido '${TAG_INPUT_RAW}'. Formato esperado: vMAJOR.MINOR.PATCH (o MAJOR.MINOR.PATCH)." >&2
              exit 1
            fi
            VERSION_FROM_TAG="${TAG_FROM_INPUT#v}"
          else
            TAG_FROM_INPUT=""
            VERSION_FROM_TAG=""
          fi

          if [[ -n "${VERSION_INPUT_RAW}" ]]; then
            if ! VERSION_INPUT="$(normalize_version_input "${VERSION_INPUT_RAW}")"; then
              echo "Version invalida '${VERSION_INPUT_RAW}'. Formato esperado: MAJOR.MINOR.PATCH (o vMAJOR.MINOR.PATCH)." >&2
              exit 1
            fi
          else
            VERSION_INPUT=""
          fi

          if [[ -n "${VERSION_INPUT}" && -n "${VERSION_FROM_TAG}" && "${VERSION_INPUT}" != "${VERSION_FROM_TAG}" ]]; then
            echo "Inconsistencia: tag=${TAG_FROM_INPUT} y version=${VERSION_INPUT} no coinciden." >&2
            exit 1
          fi

          if [[ -n "${VERSION_INPUT}" ]]; then
            SEMVER="${VERSION_INPUT}"
          else
            SEMVER="${VERSION_FROM_TAG}"
          fi

          TAG="v${SEMVER}"
          RELEASE_REF="${REF_INPUT}"
          TAG_EXISTS="false"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
            RELEASE_REF="${TAG}"
          elif git ls-remote --exit-code --refs --tags origin "${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
            RELEASE_REF="${TAG}"
          fi

          TARGET_RELEASE_REPO="${{ github.repository }}"
          if [[ "${PUBLISH_TO_DOWNLOADS_INPUT}" == "true" ]]; then
            if [[ -z "${DOWNLOADS_REPO_RAW}" ]]; then
              echo "Debes indicar 'downloads_repo' cuando publish_to_downloads_repo=true." >&2
              exit 1
            fi
            if ! TARGET_RELEASE_REPO="$(normalize_repo_input "${DOWNLOADS_REPO_RAW}")"; then
              echo "downloads_repo invalido '${DOWNLOADS_REPO_RAW}'. Formato esperado: owner/repo." >&2
              exit 1
            fi
          fi

          if [[ "${CREATE_TAG_INPUT}" != "true" && "${CREATE_TAG_INPUT}" != "false" ]]; then
            CREATE_TAG_INPUT="true"
          fi

          echo "release_ref=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${TAG_EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${PUBLISH_INPUT}" >> "${GITHUB_OUTPUT}"
          echo "publish_installers=${PUBLISH_INSTALLERS_INPUT}" >> "${GITHUB_OUTPUT}"
          echo "target_release_repo=${TARGET_RELEASE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "create_tag_if_missing=${CREATE_TAG_INPUT}" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS artifact
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (macOS)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cmake --preset macos-release

      - name: Build (macOS)
        run: cmake --build --preset macos-release

      - name: Upload Standalone (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-macos-standalone-${{ needs.prepare.outputs.semver }}
          path: build/macos-release/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

      - name: Package PKG installer (macOS)
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          bash scripts/package_macos_pkg.sh \
            --version "${SEMVER}" \
            --standalone-dir build/macos-release/MTControls_artefacts/Release/Standalone \
            --output-dir dist

      - name: Upload installer (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: playworship-macos-installer-${{ needs.prepare.outputs.semver }}
          path: dist/playworship-macos-installer-${{ needs.prepare.outputs.semver }}.pkg
          if-no-files-found: error

  build-windows:
    name: Build Windows artifacts
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-release
            build_dir: windows-release
          - arch: x86
            preset: windows-x86-release
            build_dir: windows-x86-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Configure (Windows)
        env:
          JUCE_DIR: ${{ github.workspace }}\\third_party\\JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (Windows)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Upload Standalone (Windows ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-windows-${{ matrix.arch }}-standalone-${{ needs.prepare.outputs.semver }}
          path: build/${{ matrix.build_dir }}/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer (Windows ${{ matrix.arch }})
        shell: pwsh
        run: |
          ./scripts/package_windows_installer.ps1 `
            -Version "${{ needs.prepare.outputs.semver }}" `
            -Architecture "${{ matrix.arch }}" `
            -StandaloneDir "build/${{ matrix.build_dir }}/MTControls_artefacts/Release/Standalone" `
            -OutputDir "dist" `
            -IssFile "packaging/windows/MTControls.iss"

      - name: Upload installer (Windows ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: playworship-windows-installer-${{ matrix.arch }}-${{ needs.prepare.outputs.semver }}
          path: dist/playworship-windows-installer-${{ needs.prepare.outputs.semver }}-${{ matrix.arch }}.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux artifact
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            mesa-common-dev \
            ninja-build

      - name: Download static ffmpeg (Linux)
        run: |
          mkdir -p third_party/ffmpeg/linux
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C third_party/ffmpeg/linux --strip-components=1
          mv third_party/ffmpeg/linux/ffmpeg third_party/ffmpeg/linux/ffmpeg.bin
          mv third_party/ffmpeg/linux/ffmpeg.bin third_party/ffmpeg/linux/ffmpeg
          chmod +x third_party/ffmpeg/linux/ffmpeg

      - name: Configure (Linux)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
          MTCONTROLS_FFMPEG_BIN_LINUX: ${{ github.workspace }}/third_party/ffmpeg/linux/ffmpeg
        run: |
          cmake --preset linux-release \
            -DMTCONTROLS_BUNDLE_FFMPEG=ON \
            -DMTCONTROLS_FFMPEG_BIN_LINUX="$MTCONTROLS_FFMPEG_BIN_LINUX"

      - name: Build (Linux)
        run: cmake --build --preset linux-release

      - name: Verify ffmpeg bundled in Standalone (Linux)
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_PATH="build/linux-release/MTControls_artefacts/Release/Standalone/ffmpeg/ffmpeg"
          [[ -f "${FFMPEG_PATH}" ]] || { echo "Bundled ffmpeg missing: ${FFMPEG_PATH}" >&2; exit 1; }
          echo "Bundled ffmpeg found: ${FFMPEG_PATH}"

      - name: Upload Standalone (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-linux-standalone-${{ needs.prepare.outputs.semver }}
          path: build/linux-release/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

      - name: Package installer (Linux)
        if: needs.prepare.outputs.publish_installers == 'true'
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          bash scripts/package_linux_deb.sh \
            --version "${SEMVER}" \
            --standalone-dir build/linux-release/MTControls_artefacts/Release/Standalone \
            --output-dir dist

      - name: Upload installer (Linux)
        if: needs.prepare.outputs.publish_installers == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playworship-linux-installer-${{ needs.prepare.outputs.semver }}
          path: dist/playworship_${{ needs.prepare.outputs.semver }}_amd64.deb
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.publish_release == 'true'
    name: Publish GitHub Release
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Ensure tag exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          TAG_EXISTS="${{ needs.prepare.outputs.tag_exists }}"
          CREATE_TAG="${{ needs.prepare.outputs.create_tag_if_missing }}"

          if [[ "${TAG_EXISTS}" != "true" ]]; then
            if [[ "${CREATE_TAG}" != "true" ]]; then
              echo "El tag ${TAG} no existe y create_tag_if_missing=false." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MTControls-macos-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/macos

      - name: Download Windows artifact (x64)
        uses: actions/download-artifact@v4
        with:
          name: MTControls-windows-x64-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/windows-x64

      - name: Download Windows artifact (x86)
        uses: actions/download-artifact@v4
        with:
          name: MTControls-windows-x86-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/windows-x86

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MTControls-linux-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/linux

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: playworship-macos-installer-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Download Windows installer (x64)
        uses: actions/download-artifact@v4
        with:
          name: playworship-windows-installer-x64-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Download Windows installer (x86)
        uses: actions/download-artifact@v4
        with:
          name: playworship-windows-installer-x86-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Download Linux installer
        if: needs.prepare.outputs.publish_installers == 'true'
        uses: actions/download-artifact@v4
        with:
          name: playworship-linux-installer-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Package release assets
        shell: bash
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd dist && zip -r "../release-assets/MTControls-macos-standalone-${SEMVER}.zip" macos)
          (cd dist && zip -r "../release-assets/MTControls-windows-x64-standalone-${SEMVER}.zip" windows-x64)
          (cd dist && zip -r "../release-assets/MTControls-windows-x86-standalone-${SEMVER}.zip" windows-x86)
          (cd dist && zip -r "../release-assets/MTControls-linux-standalone-${SEMVER}.zip" linux)

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          SEMVER="${{ needs.prepare.outputs.semver }}"
          PUBLISH_INSTALLERS="${{ needs.prepare.outputs.publish_installers }}"
          SOURCE_REPO="${{ github.repository }}"
          TARGET_REPO="${{ needs.prepare.outputs.target_release_repo }}"
          RELEASE_REF="${{ needs.prepare.outputs.release_ref }}"

          if [[ "${TARGET_REPO}" == "${SOURCE_REPO}" ]]; then
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          else
            if [[ -z "${{ secrets.DOWNLOADS_REPO_TOKEN }}" ]]; then
              echo "Falta secret DOWNLOADS_REPO_TOKEN para publicar en ${TARGET_REPO}." >&2
              exit 1
            fi
            export GH_TOKEN="${{ secrets.DOWNLOADS_REPO_TOKEN }}"
          fi

          MAC_ZIP="release-assets/MTControls-macos-standalone-${SEMVER}.zip"
          WIN_X64_ZIP="release-assets/MTControls-windows-x64-standalone-${SEMVER}.zip"
          WIN_X86_ZIP="release-assets/MTControls-windows-x86-standalone-${SEMVER}.zip"
          LINUX_ZIP="release-assets/MTControls-linux-standalone-${SEMVER}.zip"
          MAC_INSTALLER="release-assets/playworship-macos-installer-${SEMVER}.pkg"
          WIN_X64_INSTALLER="release-assets/playworship-windows-installer-${SEMVER}-x64.exe"
          WIN_X86_INSTALLER="release-assets/playworship-windows-installer-${SEMVER}-x86.exe"
          LINUX_INSTALLER="release-assets/playworship_${SEMVER}_amd64.deb"
          ASSETS=("${MAC_ZIP}" "${WIN_X64_ZIP}" "${WIN_X86_ZIP}" "${LINUX_ZIP}" "${MAC_INSTALLER}" "${WIN_X64_INSTALLER}" "${WIN_X86_INSTALLER}")

          [[ -f "${MAC_INSTALLER}" ]] || { echo "Missing macOS installer: ${MAC_INSTALLER}" >&2; exit 1; }
          [[ -f "${WIN_X64_INSTALLER}" ]] || { echo "Missing Windows x64 installer: ${WIN_X64_INSTALLER}" >&2; exit 1; }
          [[ -f "${WIN_X86_INSTALLER}" ]] || { echo "Missing Windows x86 installer: ${WIN_X86_INSTALLER}" >&2; exit 1; }
          if [[ "${PUBLISH_INSTALLERS}" == "true" ]]; then
            [[ -f "${LINUX_INSTALLER}" ]] || { echo "Missing Linux installer: ${LINUX_INSTALLER}" >&2; exit 1; }
            ASSETS+=("${LINUX_INSTALLER}")
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "Release ${TAG}"
            echo
            echo "Source repo: ${SOURCE_REPO}"
            echo
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              PREV_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fvx "${TAG}" | head -n1 || true)"
              if [[ -n "${PREV_TAG}" ]]; then
                echo "Changes since ${PREV_TAG}:"
                git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${TAG}" || true
              else
                echo "Changes:"
                git log --no-merges --pretty='- %s (%h)' -n 30 "${TAG}" || true
              fi
            else
              echo "Changes:"
              git log --no-merges --pretty='- %s (%h)' -n 30 "${RELEASE_REF}" || true
            fi
          } > "${NOTES_FILE}"

          if gh release view "${TAG}" -R "${TARGET_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber -R "${TARGET_REPO}"
            gh release edit "${TAG}" -R "${TARGET_REPO}" --notes-file "${NOTES_FILE}" --title "${TAG}"
          else
            if [[ "${TARGET_REPO}" == "${SOURCE_REPO}" ]]; then
              gh release create "${TAG}" \
                "${ASSETS[@]}" \
                --title "${TAG}" \
                --target "${RELEASE_REF}" \
                --notes-file "${NOTES_FILE}" \
                -R "${TARGET_REPO}"
            else
              gh release create "${TAG}" \
                "${ASSETS[@]}" \
                --title "${TAG}" \
                --notes-file "${NOTES_FILE}" \
                -R "${TARGET_REPO}"
            fi
          fi
