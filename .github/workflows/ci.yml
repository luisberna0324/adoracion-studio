name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o SHA para construir (si el tag existe, tiene prioridad)"
        required: true
        default: main
        type: string
      tag:
        description: "Tag semver opcional (ej: v1.2.3)"
        required: false
        default: ""
        type: string
      version:
        description: "Version semver opcional (ej: 1.2.3)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publicar GitHub Release con los artefactos"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  
concurrency:
  group: build-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      semver: ${{ steps.resolve.outputs.semver }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve version, tag and ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          REF_INPUT="${{ inputs.ref }}"
          TAG_INPUT="${{ inputs.tag }}"
          VERSION_INPUT="${{ inputs.version }}"
          PUBLISH_INPUT="${{ inputs.publish_release }}"

          if [[ -z "${TAG_INPUT}" && -z "${VERSION_INPUT}" ]]; then
            echo "Debes indicar al menos 'tag' o 'version'." >&2
            exit 1
          fi

          if [[ -n "${TAG_INPUT}" ]]; then
            if [[ ! "${TAG_INPUT}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Tag invalido '${TAG_INPUT}'. Formato esperado: vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            TAG_FROM_INPUT="${TAG_INPUT}"
            VERSION_FROM_TAG="${TAG_INPUT#v}"
          else
            TAG_FROM_INPUT=""
            VERSION_FROM_TAG=""
          fi

          if [[ -n "${VERSION_INPUT}" ]]; then
            if [[ ! "${VERSION_INPUT}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Version invalida '${VERSION_INPUT}'. Formato esperado: MAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          fi

          if [[ -n "${VERSION_INPUT}" && -n "${VERSION_FROM_TAG}" && "${VERSION_INPUT}" != "${VERSION_FROM_TAG}" ]]; then
            echo "Inconsistencia: tag=${TAG_INPUT} y version=${VERSION_INPUT} no coinciden." >&2
            exit 1
          fi

          if [[ -n "${VERSION_INPUT}" ]]; then
            SEMVER="${VERSION_INPUT}"
          else
            SEMVER="${VERSION_FROM_TAG}"
          fi

          TAG="v${SEMVER}"
          RELEASE_REF="${REF_INPUT}"
          TAG_EXISTS="false"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS="true"
            RELEASE_REF="${TAG}"
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            TAG_EXISTS="true"
            RELEASE_REF="${TAG}"
          fi

          echo "release_ref=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${TAG_EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${PUBLISH_INPUT}" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS artifact
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (macOS)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cmake --preset macos-release

      - name: Build (macOS)
        run: cmake --build --preset macos-release

      - name: Upload Standalone (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-macos-standalone-${{ needs.prepare.outputs.semver }}
          path: build/macos-release/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

  build-windows:
    name: Build Windows artifact
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Configure (Windows)
        env:
          JUCE_DIR: ${{ github.workspace }}\\third_party\\JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cmake --preset windows-release

      - name: Build (Windows)
        run: cmake --build --preset windows-release

      - name: Upload Standalone (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-windows-standalone-${{ needs.prepare.outputs.semver }}
          path: build/windows-release/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.publish_release == 'true'
    name: Publish GitHub Release
    needs:
      - prepare
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Ensure tag exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          TAG_EXISTS="${{ needs.prepare.outputs.tag_exists }}"

          if [[ "${TAG_EXISTS}" != "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MTControls-macos-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MTControls-windows-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/windows

      - name: Package release assets
        shell: bash
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd dist && zip -r "../release-assets/MTControls-macos-standalone-${SEMVER}.zip" macos)
          (cd dist && zip -r "../release-assets/MTControls-windows-standalone-${SEMVER}.zip" windows)

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          SEMVER="${{ needs.prepare.outputs.semver }}"
          MAC_ZIP="release-assets/MTControls-macos-standalone-${SEMVER}.zip"
          WIN_ZIP="release-assets/MTControls-windows-standalone-${SEMVER}.zip"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${MAC_ZIP}" "${WIN_ZIP}" --clobber
          else
            gh release create "${TAG}" \
              "${MAC_ZIP}" \
              "${WIN_ZIP}" \
              --title "${TAG}" \
              --target "${{ needs.prepare.outputs.release_ref }}" \
              --generate-notes
          fi
