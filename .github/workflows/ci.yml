name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o SHA para construir (si el tag existe, tiene prioridad)"
        required: true
        default: main
        type: string
      release_kind:
        description: "Tipo de incremento semver desde el ultimo tag estable vX.Y.Z"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      publish_release:
        description: "Publicar GitHub Release con los artefactos"
        required: true
        default: false
        type: boolean
      publish_installers:
        description: "Generar/publicar instalador Linux (.deb). macOS (.pkg) y Windows (.exe) siempre se generan"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  
concurrency:
  group: build-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      semver: ${{ steps.resolve.outputs.semver }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      publish_installers: ${{ steps.resolve.outputs.publish_installers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, tag and ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          REF_INPUT="$(trim "${{ inputs.ref }}")"
          if [[ -z "${REF_INPUT}" ]]; then
            REF_INPUT="main"
          fi
          RELEASE_KIND_INPUT="$(trim "${{ inputs.release_kind }}")"
          PUBLISH_INPUT="${{ inputs.publish_release }}"
          PUBLISH_INSTALLERS_INPUT="${{ inputs.publish_installers }}"

          if [[ "${RELEASE_KIND_INPUT}" != "major" && "${RELEASE_KIND_INPUT}" != "minor" && "${RELEASE_KIND_INPUT}" != "patch" ]]; then
            echo "release_kind invalido '${RELEASE_KIND_INPUT}'. Valores permitidos: major|minor|patch." >&2
            exit 1
          fi

          git fetch --tags --force origin
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "${LATEST_TAG}" ]]; then
            BASE_MAJOR=0
            BASE_MINOR=0
            BASE_PATCH=0
          elif [[ "${LATEST_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            BASE_MAJOR="${BASH_REMATCH[1]}"
            BASE_MINOR="${BASH_REMATCH[2]}"
            BASE_PATCH="${BASH_REMATCH[3]}"
          else
            echo "Ultimo tag semver invalido '${LATEST_TAG}'. Se esperaba formato vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          NEXT_MAJOR="${BASE_MAJOR}"
          NEXT_MINOR="${BASE_MINOR}"
          NEXT_PATCH="${BASE_PATCH}"

          case "${RELEASE_KIND_INPUT}" in
            major)
              NEXT_MAJOR=$((BASE_MAJOR + 1))
              NEXT_MINOR=0
              NEXT_PATCH=0
              ;;
            minor)
              NEXT_MINOR=$((BASE_MINOR + 1))
              NEXT_PATCH=0
              ;;
            patch)
              NEXT_PATCH=$((BASE_PATCH + 1))
              ;;
          esac

          SEMVER="${NEXT_MAJOR}.${NEXT_MINOR}.${NEXT_PATCH}"
          if [[ "${SEMVER}" == "0.0.0" ]]; then
            echo "Semver calculado invalido: ${SEMVER}" >&2
            exit 1
          fi

          TAG="v${SEMVER}"
          RELEASE_REF="${REF_INPUT}"
          TAG_EXISTS="false"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
            RELEASE_REF="${TAG}"
          elif git ls-remote --exit-code --refs --tags origin "${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
            RELEASE_REF="${TAG}"
          fi

          echo "release_ref=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${TAG_EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${PUBLISH_INPUT}" >> "${GITHUB_OUTPUT}"
          echo "publish_installers=${PUBLISH_INSTALLERS_INPUT}" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS artifact
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (macOS)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cmake --preset macos-release

      - name: Build (macOS)
        run: cmake --build --preset macos-release

      - name: Package PKG installer (macOS)
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          bash scripts/package_macos_pkg.sh \
            --version "${SEMVER}" \
            --standalone-dir build/macos-release/MTControls_artefacts/Release/Standalone \
            --output-dir dist

      - name: Upload installer (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: playworship-macos-installer-${{ needs.prepare.outputs.semver }}
          path: dist/playworship-macos-installer-${{ needs.prepare.outputs.semver }}.pkg
          if-no-files-found: error

  build-windows:
    name: Build Windows artifacts
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-release
            build_dir: windows-release
          - arch: x86
            preset: windows-x86-release
            build_dir: windows-x86-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Configure (Windows)
        env:
          JUCE_DIR: ${{ github.workspace }}\\third_party\\JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (Windows)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer (Windows ${{ matrix.arch }})
        shell: pwsh
        run: |
          ./scripts/package_windows_installer.ps1 `
            -Version "${{ needs.prepare.outputs.semver }}" `
            -Architecture "${{ matrix.arch }}" `
            -StandaloneDir "build/${{ matrix.build_dir }}/MTControls_artefacts/Release/Standalone" `
            -OutputDir "dist" `
            -IssFile "packaging/windows/MTControls.iss"

      - name: Upload installer (Windows ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: playworship-windows-installer-${{ matrix.arch }}-${{ needs.prepare.outputs.semver }}
          path: dist/playworship-windows-installer-${{ needs.prepare.outputs.semver }}-${{ matrix.arch }}.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux artifact
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            mesa-common-dev \
            ninja-build

      - name: Download static ffmpeg (Linux)
        run: |
          mkdir -p third_party/ffmpeg/linux
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C third_party/ffmpeg/linux --strip-components=1
          mv third_party/ffmpeg/linux/ffmpeg third_party/ffmpeg/linux/ffmpeg.bin
          mv third_party/ffmpeg/linux/ffmpeg.bin third_party/ffmpeg/linux/ffmpeg
          chmod +x third_party/ffmpeg/linux/ffmpeg

      - name: Configure (Linux)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
          MTCONTROLS_FFMPEG_BIN_LINUX: ${{ github.workspace }}/third_party/ffmpeg/linux/ffmpeg
        run: |
          cmake --preset linux-release \
            -DMTCONTROLS_BUNDLE_FFMPEG=ON \
            -DMTCONTROLS_FFMPEG_BIN_LINUX="$MTCONTROLS_FFMPEG_BIN_LINUX"

      - name: Build (Linux)
        run: cmake --build --preset linux-release

      - name: Verify ffmpeg bundled in Standalone (Linux)
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_PATH="build/linux-release/MTControls_artefacts/Release/Standalone/ffmpeg/ffmpeg"
          [[ -f "${FFMPEG_PATH}" ]] || { echo "Bundled ffmpeg missing: ${FFMPEG_PATH}" >&2; exit 1; }
          echo "Bundled ffmpeg found: ${FFMPEG_PATH}"

      - name: Package installer (Linux)
        if: needs.prepare.outputs.publish_installers == 'true'
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          bash scripts/package_linux_deb.sh \
            --version "${SEMVER}" \
            --standalone-dir build/linux-release/MTControls_artefacts/Release/Standalone \
            --output-dir dist

      - name: Upload installer (Linux)
        if: needs.prepare.outputs.publish_installers == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playworship-linux-installer-${{ needs.prepare.outputs.semver }}
          path: dist/playworship_${{ needs.prepare.outputs.semver }}_amd64.deb
          if-no-files-found: error

  publish-gcs:
    name: Upload installers to GCS
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Validate GCS secrets
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${GCS_BUCKET}" ]] || { echo "Missing required secret: GCS_BUCKET" >&2; exit 1; }
          [[ -n "${GCP_SA_KEY}" ]] || { echo "Missing required secret: GCP_SA_KEY" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: playworship-macos-installer-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Download Windows installer (x64)
        uses: actions/download-artifact@v4
        with:
          name: playworship-windows-installer-x64-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Download Windows installer (x86)
        uses: actions/download-artifact@v4
        with:
          name: playworship-windows-installer-x86-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Download Linux installer
        if: needs.prepare.outputs.publish_installers == 'true'
        uses: actions/download-artifact@v4
        with:
          name: playworship-linux-installer-${{ needs.prepare.outputs.semver }}
          path: release-assets

      - name: Upload installers + retain latest 3 versions
        shell: bash
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
          PUBLISH_INSTALLERS: ${{ needs.prepare.outputs.publish_installers }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
        run: |
          set -euo pipefail

          PREFIX="${GCS_PREFIX:-installers}"
          BASE_URI="gs://${GCS_BUCKET}/${PREFIX}"
          VERSION_DIR="v${SEMVER}"

          MAC_LOCAL="release-assets/playworship-macos-installer-${SEMVER}.pkg"
          WIN_X64_LOCAL="release-assets/playworship-windows-installer-${SEMVER}-x64.exe"
          WIN_X86_LOCAL="release-assets/playworship-windows-installer-${SEMVER}-x86.exe"
          LINUX_LOCAL="release-assets/playworship_${SEMVER}_amd64.deb"

          [[ -f "${MAC_LOCAL}" ]] || { echo "Missing macOS installer: ${MAC_LOCAL}" >&2; exit 1; }
          [[ -f "${WIN_X64_LOCAL}" ]] || { echo "Missing Windows x64 installer: ${WIN_X64_LOCAL}" >&2; exit 1; }
          [[ -f "${WIN_X86_LOCAL}" ]] || { echo "Missing Windows x86 installer: ${WIN_X86_LOCAL}" >&2; exit 1; }
          if [[ "${PUBLISH_INSTALLERS}" == "true" ]]; then
            [[ -f "${LINUX_LOCAL}" ]] || { echo "Missing Linux installer: ${LINUX_LOCAL}" >&2; exit 1; }
          fi

          upload_installer() {
            local platform="$1"
            local local_file="$2"
            local filename
            filename="$(basename "${local_file}")"
            local target_dir="${BASE_URI}/${platform}/${VERSION_DIR}"
            gsutil cp "${local_file}" "${target_dir}/${filename}"
          }

          retain_latest_three() {
            local platform="$1"
            local platform_base="${BASE_URI}/${platform}/"
            local dirs_raw=""
            dirs_raw="$(gsutil ls "${platform_base}" 2>/dev/null || true)"
            if [[ -z "${dirs_raw}" ]]; then
              return 0
            fi

            mapfile -t version_dirs < <(printf '%s\n' "${dirs_raw}" | sed -nE 's#^(gs://.*/v[0-9]+\.[0-9]+\.[0-9]+/)$#\1#p')
            local count="${#version_dirs[@]}"
            if (( count <= 3 )); then
              return 0
            fi

            mapfile -t sorted_dirs < <(
              for dir in "${version_dirs[@]}"; do
                ver="${dir%/}"
                ver="${ver##*/}"
                printf '%s\t%s\n' "${ver#v}" "${dir}"
              done | sort -t$'\t' -k1,1V | cut -f2
            )

            local delete_count=$((count - 3))
            for ((i = 0; i < delete_count; ++i)); do
              gsutil -m rm -r "${sorted_dirs[$i]}"
            done
          }

          upload_installer "macos" "${MAC_LOCAL}"
          upload_installer "windows" "${WIN_X64_LOCAL}"
          upload_installer "windows" "${WIN_X86_LOCAL}"
          if [[ "${PUBLISH_INSTALLERS}" == "true" ]]; then
            upload_installer "linux" "${LINUX_LOCAL}"
          fi

          retain_latest_three "macos"
          retain_latest_three "windows"
          if [[ "${PUBLISH_INSTALLERS}" == "true" ]]; then
            retain_latest_three "linux"
          fi

  publish:
    if: needs.prepare.outputs.publish_release == 'true'
    name: Publish GitHub Release
    needs:
      - prepare
      - publish-gcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Ensure tag exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          TAG_EXISTS="${{ needs.prepare.outputs.tag_exists }}"

          if [[ "${TAG_EXISTS}" != "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub release (without binary assets)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --target "${{ needs.prepare.outputs.release_ref }}" \
              --generate-notes
          fi

      - name: Add GCS links to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare.outputs.tag }}"
          SEMVER="${{ needs.prepare.outputs.semver }}"
          PUBLISH_INSTALLERS="${{ needs.prepare.outputs.publish_installers }}"
          PREFIX="${GCS_PREFIX:-installers}"

          if [[ -z "${GCS_BUCKET}" ]]; then
            echo "GCS_BUCKET is empty; skipping bucket links in release notes."
            exit 0
          fi

          VERSION_DIR="v${SEMVER}"
          BASE_HTTPS="https://storage.googleapis.com/${GCS_BUCKET}/${PREFIX}"
          BASE_GS="gs://${GCS_BUCKET}/${PREFIX}"

          MAC_URL="${BASE_HTTPS}/macos/${VERSION_DIR}/playworship-macos-installer-${SEMVER}.pkg"
          WIN_X64_URL="${BASE_HTTPS}/windows/${VERSION_DIR}/playworship-windows-installer-${SEMVER}-x64.exe"
          WIN_X86_URL="${BASE_HTTPS}/windows/${VERSION_DIR}/playworship-windows-installer-${SEMVER}-x86.exe"
          LINUX_URL="${BASE_HTTPS}/linux/${VERSION_DIR}/playworship_${SEMVER}_amd64.deb"

          marker_start="<!-- bucket-links:start -->"
          marker_end="<!-- bucket-links:end -->"
          links_md="$(mktemp)"
          current_body="$(mktemp)"
          cleaned_body="$(mktemp)"
          merged_body="$(mktemp)"

          {
            echo "${marker_start}"
            echo "## Descargas en Bucket"
            echo
            echo "- Directorio versionado (GCS URI): \`${BASE_GS}\`"
            echo "- Carpeta de esta versión (GCS URI): \`${BASE_GS}/macos/${VERSION_DIR}\`, \`${BASE_GS}/windows/${VERSION_DIR}\`, \`${BASE_GS}/linux/${VERSION_DIR}\`"
            echo "- Carpeta base (HTTP): ${BASE_HTTPS}/"
            echo
            echo "### Enlaces directos"
            echo "- macOS (.pkg): ${MAC_URL}"
            echo "- Windows x64 (.exe): ${WIN_X64_URL}"
            echo "- Windows x86 (.exe): ${WIN_X86_URL}"
            if [[ "${PUBLISH_INSTALLERS}" == "true" ]]; then
              echo "- Linux (.deb): ${LINUX_URL}"
            fi
            echo "${marker_end}"
          } > "${links_md}"

          gh release view "${TAG}" --json body -q .body > "${current_body}" || true

          awk -v start="${marker_start}" -v end="${marker_end}" '
            $0 ~ start {inblock=1; next}
            $0 ~ end {inblock=0; next}
            !inblock {print}
          ' "${current_body}" > "${cleaned_body}"

          cp "${cleaned_body}" "${merged_body}"
          if [[ -s "${merged_body}" ]]; then
            printf "\n\n" >> "${merged_body}"
          fi
          cat "${links_md}" >> "${merged_body}"

          gh release edit "${TAG}" --notes-file "${merged_body}"
