# This file contains the CI/CD configuration for the project.
# It is managed using GitHub Actions.

name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JUCE
        run: |
          git clone https://github.com/juce-framework/JUCE.git
          cd JUCE
          git checkout 8.1.0
      - name: Build the project
        run: |
          cd ProjectFolder
          build --config Release

# Additional steps for testing and deployment

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JUCE for testing
        run: |
          git clone https://github.com/juce-framework/JUCE.git
          cd JUCE
          git checkout 8.1.0
      - name: Run tests
        run: |
          cd ProjectFolder
          run_tests
