name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o SHA para construir (si el tag existe, tiene prioridad)"
        required: true
        default: main
        type: string
      release_kind:
        description: "Tipo de incremento semver desde el ultimo tag estable vX.Y.Z"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      publish_release:
        description: "Publicar instaladores en GCS, simbolos Sentry, limpiar versiones y actualizar manifiesto/Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  
concurrency:
  group: build-artifacts-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      semver: ${{ steps.resolve.outputs.semver }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, tag and ref
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_RELEASE_KIND: ${{ inputs.release_kind }}
          REQUESTED_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "${value}"
          }

          REF_INPUT="$(trim "${REQUESTED_REF}")"
          if [[ -z "${REF_INPUT}" ]]; then
            REF_INPUT="main"
          fi
          RELEASE_KIND_INPUT="$(trim "${REQUESTED_RELEASE_KIND}")"
          PUBLISH_INPUT="${REQUESTED_PUBLISH}"

          if [[ "${RELEASE_KIND_INPUT}" != "major" && "${RELEASE_KIND_INPUT}" != "minor" && "${RELEASE_KIND_INPUT}" != "patch" ]]; then
            echo "release_kind invalido '${RELEASE_KIND_INPUT}'. Valores permitidos: major|minor|patch." >&2
            exit 1
          fi

          git fetch --tags --force origin '+refs/heads/*:refs/remotes/origin/*'
          resolve_ref() {
            local requested="$1"
            local branch="${requested#refs/heads/}"
            if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              git rev-parse --verify --end-of-options "refs/remotes/origin/${branch}^{commit}"
            else
              git rev-parse --verify --end-of-options "${requested}^{commit}"
            fi
          }
          # An explicitly requested stable tag keeps its own version.
          if [[ "${REF_INPUT}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_SHA="$(git rev-parse --verify --end-of-options "refs/tags/${REF_INPUT}^{commit}")"
            echo "release_ref=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "semver=${REF_INPUT#v}" >> "${GITHUB_OUTPUT}"
            echo "tag=${REF_INPUT}" >> "${GITHUB_OUTPUT}"
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
            echo "publish_release=${PUBLISH_INPUT}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LATEST_TAG="$(git tag --list | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -rV | head -n1 || true)"
          if [[ -z "${LATEST_TAG}" ]]; then
            BASE_MAJOR=0
            BASE_MINOR=0
            BASE_PATCH=0
          elif [[ "${LATEST_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            BASE_MAJOR="${BASH_REMATCH[1]}"
            BASE_MINOR="${BASH_REMATCH[2]}"
            BASE_PATCH="${BASH_REMATCH[3]}"
          else
            echo "Ultimo tag semver invalido '${LATEST_TAG}'. Se esperaba formato vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          NEXT_MAJOR="${BASE_MAJOR}"
          NEXT_MINOR="${BASE_MINOR}"
          NEXT_PATCH="${BASE_PATCH}"

          case "${RELEASE_KIND_INPUT}" in
            major)
              NEXT_MAJOR=$((BASE_MAJOR + 1))
              NEXT_MINOR=0
              NEXT_PATCH=0
              ;;
            minor)
              NEXT_MINOR=$((BASE_MINOR + 1))
              NEXT_PATCH=0
              ;;
            patch)
              NEXT_PATCH=$((BASE_PATCH + 1))
              ;;
          esac

          SEMVER="${NEXT_MAJOR}.${NEXT_MINOR}.${NEXT_PATCH}"
          if [[ "${SEMVER}" == "0.0.0" ]]; then
            echo "Semver calculado invalido: ${SEMVER}" >&2
            exit 1
          fi

          TAG="v${SEMVER}"
          RELEASE_REF="$(resolve_ref "${REF_INPUT}")"
          TAG_EXISTS="false"

          # A collision must not silently replace the requested revision.
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists; request that tag explicitly." >&2
            exit 1
          fi

          echo "release_ref=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "semver=${SEMVER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${TAG_EXISTS}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${PUBLISH_INPUT}" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS artifact
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Create third_party directory
        run: mkdir -p third_party

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Checkout Sentry Native
        uses: actions/checkout@v4
        with:
          repository: getsentry/sentry-native
          ref: 0.9.1
          path: third_party/sentry-native
          submodules: recursive
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Bootstrap required Bungee SDK
        run: bash scripts/bootstrap_bungee.sh

      - name: Configure (macOS)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
          MTCONTROLS_IOS_BUILD_NUMBER: ${{ github.run_number }}
          MTCONTROLS_ENABLE_SENTRY: ON
          SENTRY_NATIVE_DIR: ${{ github.workspace }}/third_party/sentry-native
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_APP }}
          SENTRY_ENVIRONMENT: production
        run: >-
          cmake --preset macos-release
          -DMTCONTROLS_ENABLE_SENTRY=ON
          -DSENTRY_NATIVE_DIR="${{ github.workspace }}/third_party/sentry-native"
          -DMTCONTROLS_GIT_COMMIT="${{ needs.prepare.outputs.release_ref }}"

      - name: Build (macOS)
        run: cmake --build --preset macos-release

      - name: Upload Sentry debug symbols (macOS)
        if: needs.prepare.outputs.publish_release == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: lujuma
          SENTRY_PROJECT: playworship-app
          SENTRY_RELEASE: playworship-app@${{ needs.prepare.outputs.semver }}+${{ github.run_number }}.${{ needs.prepare.outputs.release_ref }}
        run: bash scripts/upload_sentry_debug_symbols.sh build/macos-release/MTControls_artefacts/Release/Standalone

      - name: Verify Bungee bundled (macOS)
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos-release/MTControls_artefacts/Release/Standalone/PlayWorship.app"
          test -f "${APP}/Contents/Frameworks/libbungee.dylib"
          test -f "${APP}/Contents/Resources/ThirdPartyLicenses/Bungee-MPL-2.0.txt"
          otool -L "${APP}/Contents/MacOS/PlayWorship" | grep -q "@rpath/libbungee.dylib"
          codesign --verify --deep --strict "${APP}"

      - name: Package PKG installer (macOS)
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          bash scripts/package_macos_pkg.sh \
            --version "${SEMVER}" \
            --standalone-dir build/macos-release/MTControls_artefacts/Release/Standalone \
            --output-dir dist

      - name: Authenticate to Google Cloud
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload installer to GCS (macOS)
        if: needs.prepare.outputs.publish_release == 'true'
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          set -euo pipefail
          PREFIX="${GCS_PREFIX:-installers}"
          FILE="dist/playworship-macos-installer-${SEMVER}.pkg"
          [[ -f "${FILE}" ]] || { echo "Missing macOS installer: ${FILE}" >&2; exit 1; }
          gcloud storage cp "${FILE}" "gs://${GCS_BUCKET}/${PREFIX}/macos/v${SEMVER}/"

  build-windows:
    name: Build Windows artifacts
    needs: prepare
    # windows-latest currently resolves to the VS 2026 image, which does not
    # include a Visual Studio 2022 instance for our pinned CMake generator.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-release
            build_dir: windows-release
          - arch: x86
            preset: windows-x86-release
            build_dir: windows-x86-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Create third_party directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path third_party

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Checkout Sentry Native
        uses: actions/checkout@v4
        with:
          repository: getsentry/sentry-native
          ref: 0.9.1
          path: third_party/sentry-native
          submodules: recursive
          fetch-depth: 1

      - name: Bootstrap required Bungee SDK
        if: matrix.arch == 'x64'
        shell: bash
        run: bash scripts/bootstrap_bungee.sh

      - name: Configure (Windows)
        env:
          JUCE_DIR: ${{ github.workspace }}\\third_party\\JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.semver }}
          MTCONTROLS_IOS_BUILD_NUMBER: ${{ github.run_number }}
          MTCONTROLS_ENABLE_SENTRY: ON
          SENTRY_NATIVE_DIR: ${{ github.workspace }}\\third_party\\sentry-native
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_APP }}
          SENTRY_ENVIRONMENT: production
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DMTCONTROLS_ENABLE_SENTRY=ON
          -DSENTRY_NATIVE_DIR="${{ github.workspace }}\\third_party\\sentry-native"
          -DMTCONTROLS_GIT_COMMIT="${{ needs.prepare.outputs.release_ref }}"

      - name: Build (Windows)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Verify Bungee bundled (Windows)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $dir = "build/${{ matrix.build_dir }}/MTControls_artefacts/Release/Standalone"
          if (!(Test-Path "$dir/bungee.dll")) { throw "Missing bungee.dll" }
          if (!(Test-Path "$dir/ThirdPartyLicenses/Bungee-MPL-2.0.txt")) {
            throw "Missing Bungee license"
          }

      - name: Verify legacy SoundTouch backend (Windows x86)
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          $dir = "build/${{ matrix.build_dir }}/MTControls_artefacts/Release/Standalone"
          $cache = "build/${{ matrix.build_dir }}/CMakeCache.txt"
          if (!(Get-ChildItem -Path $dir -Filter *.exe -File | Select-Object -First 1)) {
            throw "Missing Windows x86 standalone executable"
          }
          if (Test-Path "$dir/bungee.dll") {
            throw "Windows x86 must not bundle the incompatible x64 Bungee runtime"
          }
          if (!(Select-String -Path $cache -Pattern '^MTCONTROLS_USE_BUNGEE:BOOL=OFF$' -Quiet)) {
            throw "Windows x86 was not configured with the legacy SoundTouch backend"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer (Windows ${{ matrix.arch }})
        shell: pwsh
        run: |
          ./scripts/package_windows_installer.ps1 `
            -Version "${{ needs.prepare.outputs.semver }}" `
            -Architecture "${{ matrix.arch }}" `
            -StandaloneDir "build/${{ matrix.build_dir }}/MTControls_artefacts/Release/Standalone" `
            -OutputDir "dist" `
            -IssFile "packaging/windows/MTControls.iss"

      - name: Authenticate to Google Cloud
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload installer to GCS (Windows ${{ matrix.arch }})
        if: needs.prepare.outputs.publish_release == 'true'
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          PREFIX="${GCS_PREFIX:-installers}"
          FILE="dist/playworship-windows-installer-${SEMVER}-${ARCH}.exe"
          [[ -f "${FILE}" ]] || { echo "Missing Windows installer: ${FILE}" >&2; exit 1; }
          gcloud storage cp "${FILE}" "gs://${GCS_BUCKET}/${PREFIX}/windows/v${SEMVER}/"

  build-android:
    name: Build signed Android APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed from the Android SDK.
          # Declare only the package still required before installing the
          # versioned platform, build-tools, NDK and CMake below.
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709' 'cmake;3.22.1'
      - name: Bootstrap Bungee Android SDK
        run: bash scripts/bootstrap_bungee.sh
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_BASE64}" ]] || { echo 'Missing ANDROID_RELEASE_KEYSTORE_BASE64' >&2; exit 1; }
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/playworship-release.jks"
          echo "PLAYWORSHIP_ANDROID_KEYSTORE=${RUNNER_TEMP}/playworship-release.jks" >> "${GITHUB_ENV}"
      - name: Build release APK
        working-directory: android
        env:
          PLAYWORSHIP_VERSION_NAME: ${{ needs.prepare.outputs.semver }}
          PLAYWORSHIP_VERSION_CODE: ${{ github.run_number }}
          PLAYWORSHIP_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          PLAYWORSHIP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          PLAYWORSHIP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in PLAYWORSHIP_ANDROID_STORE_PASSWORD PLAYWORSHIP_ANDROID_KEY_ALIAS PLAYWORSHIP_ANDROID_KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing Android signing secret: ${value}" >&2; exit 1; }
          done
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify and name release APK
        shell: bash
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "${APK}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${APK}"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}" | grep -F "versionName='${SEMVER}'"
          mkdir -p dist
          cp "${APK}" "dist/playworship-android-${SEMVER}-arm64.apk"
      - name: Authenticate to Google Cloud
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: needs.prepare.outputs.publish_release == 'true'
      - name: Upload installer to GCS (Android)
        if: needs.prepare.outputs.publish_release == 'true'
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          set -euo pipefail
          PREFIX="${GCS_PREFIX:-installers}"
          gcloud storage cp "dist/playworship-android-${SEMVER}-arm64.apk" "gs://${GCS_BUCKET}/${PREFIX}/android/v${SEMVER}/"

  retention-gcs:
    if: needs.prepare.outputs.publish_release == 'true'
    name: Retain latest 3 versions in GCS
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        if: needs.prepare.outputs.publish_release == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Retention cleanup
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
        run: |
          set -euo pipefail
          PREFIX="${GCS_PREFIX:-installers}"
          BASE_URI="gs://${GCS_BUCKET}/${PREFIX}"

          retain_latest_three() {
            local platform="$1"
            local platform_base="${BASE_URI}/${platform}/"
            local dirs_raw=""
            dirs_raw="$(gcloud storage ls "${platform_base}" 2>/dev/null || true)"
            if [[ -z "${dirs_raw}" ]]; then
              return 0
            fi
            mapfile -t version_dirs < <(printf '%s\n' "${dirs_raw}" | sed -nE 's#^(gs://.*/v[0-9]+\.[0-9]+\.[0-9]+/)$#\1#p')
            local count="${#version_dirs[@]}"
            if (( count <= 3 )); then
              return 0
            fi
            mapfile -t sorted_dirs < <(
              for dir in "${version_dirs[@]}"; do
                ver="${dir%/}"
                ver="${ver##*/}"
                printf '%s\t%s\n' "${ver#v}" "${dir}"
              done | sort -t$'\t' -k1,1V | cut -f2
            )
            local delete_count=$((count - 3))
            for ((i = 0; i < delete_count; ++i)); do
              gcloud storage rm --recursive "${sorted_dirs[$i]}"
            done
          }

          retain_latest_three "macos"
          retain_latest_three "windows"
          retain_latest_three "android"

  publish-downloads:
    if: needs.prepare.outputs.publish_release == 'true'
    name: Publish landing download manifest
    needs:
      - prepare
      - retention-gcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: needs.prepare.outputs.publish_release == 'true'
      - name: Publish latest release metadata
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: bash scripts/publish_download_manifest.sh

  publish:
    if: needs.prepare.outputs.publish_release == 'true'
    name: Publish GitHub Release
    needs:
      - prepare
      - retention-gcs
      - publish-downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Ensure tag exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          TAG_EXISTS="${{ needs.prepare.outputs.tag_exists }}"

          if [[ "${TAG_EXISTS}" != "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub release (without binary assets)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --target "${{ needs.prepare.outputs.release_ref }}" \
              --generate-notes
          fi

      - name: Add GCS links to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ vars.GCS_INSTALLERS_PREFIX }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare.outputs.tag }}"
          SEMVER="${{ needs.prepare.outputs.semver }}"
          PREFIX="${GCS_PREFIX:-installers}"

          if [[ -z "${GCS_BUCKET}" ]]; then
            echo "GCS_BUCKET is empty; skipping bucket links in release notes."
            exit 0
          fi

          VERSION_DIR="v${SEMVER}"
          BASE_HTTPS="https://storage.googleapis.com/${GCS_BUCKET}/${PREFIX}"
          BASE_GS="gs://${GCS_BUCKET}/${PREFIX}"

          MAC_URL="${BASE_HTTPS}/macos/${VERSION_DIR}/playworship-macos-installer-${SEMVER}.pkg"
          WIN_X64_URL="${BASE_HTTPS}/windows/${VERSION_DIR}/playworship-windows-installer-${SEMVER}-x64.exe"
          WIN_X86_URL="${BASE_HTTPS}/windows/${VERSION_DIR}/playworship-windows-installer-${SEMVER}-x86.exe"
          ANDROID_URL="${BASE_HTTPS}/android/${VERSION_DIR}/playworship-android-${SEMVER}-arm64.apk"

          marker_start="<!-- bucket-links:start -->"
          marker_end="<!-- bucket-links:end -->"
          links_md="$(mktemp)"
          current_body="$(mktemp)"
          cleaned_body="$(mktemp)"
          merged_body="$(mktemp)"

          {
            echo "${marker_start}"
            echo "## Descargas en Bucket"
            echo
            echo "- Directorio versionado (GCS URI): \`${BASE_GS}\`"
            echo "- Carpeta de esta versión (GCS URI): \`${BASE_GS}/macos/${VERSION_DIR}\`, \`${BASE_GS}/windows/${VERSION_DIR}\`"
            echo "- Carpeta base (HTTP): ${BASE_HTTPS}/"
            echo
            echo "### Enlaces directos"
            echo "- macOS (.pkg): ${MAC_URL}"
            echo "- Windows x64 (.exe): ${WIN_X64_URL}"
            echo "- Windows x86 legado (.exe, SoundTouch): ${WIN_X86_URL}"
            echo "- Android arm64 (.apk): ${ANDROID_URL}"
            echo "${marker_end}"
          } > "${links_md}"

          gh release view "${TAG}" --json body -q .body > "${current_body}" || true

          awk -v start="${marker_start}" -v end="${marker_end}" '
            $0 ~ start {inblock=1; next}
            $0 ~ end {inblock=0; next}
            !inblock {print}
          ' "${current_body}" > "${cleaned_body}"

          cp "${cleaned_body}" "${merged_body}"
          if [[ -s "${merged_body}" ]]; then
            printf "\n\n" >> "${merged_body}"
          fi
          cat "${links_md}" >> "${merged_body}"

          gh release edit "${TAG}" --notes-file "${merged_body}"
