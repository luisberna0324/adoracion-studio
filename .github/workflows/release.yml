name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Manual stable bump type"
        required: true
        default: major
        type: choice
        options:
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.merge_commit_sha || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semver.outputs.semver }}
      next_stable: ${{ steps.semver.outputs.next_stable }}
      tag: ${{ steps.semver.outputs.tag }}
      source_branch: ${{ steps.context.outputs.source_branch }}
      release_ref: ${{ steps.context.outputs.release_ref }}
      release_kind: ${{ steps.context.outputs.release_kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release context
        id: context
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "Manual release must run from main. Current branch: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            echo "source_branch=main" >> "${GITHUB_OUTPUT}"
            echo "release_ref=main" >> "${GITHUB_OUTPUT}"
            echo "release_kind=${{ inputs.bump }}" >> "${GITHUB_OUTPUT}"
          else
            echo "source_branch=${{ github.event.pull_request.head.ref }}" >> "${GITHUB_OUTPUT}"
            echo "release_ref=${{ github.event.pull_request.merge_commit_sha }}" >> "${GITHUB_OUTPUT}"
            echo "release_kind=auto" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compute release SemVer
        id: semver
        shell: bash
        run: |
          if [[ "${{ steps.context.outputs.release_kind }}" == "auto" ]]; then
            scripts/semver.sh \
              --branch "${{ steps.context.outputs.source_branch }}" \
              --require-supported-branch
          else
            scripts/semver.sh \
              --release-kind "${{ steps.context.outputs.release_kind }}"
          fi

  build-macos:
    name: Build macOS release artifact
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (macOS)
        env:
          JUCE_DIR: ${{ github.workspace }}/third_party/JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.next_stable }}
        run: cmake --preset macos-release

      - name: Build (macOS)
        run: cmake --build --preset macos-release

      - name: Upload Standalone (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-macos-standalone-${{ needs.prepare.outputs.semver }}
          path: build/macos-release/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

  build-windows:
    name: Build Windows release artifact
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 501c07674e1ad693085a7e7c398f205c2677f5da
          path: third_party/JUCE
          fetch-depth: 1

      - name: Configure (Windows)
        env:
          JUCE_DIR: ${{ github.workspace }}\\third_party\\JUCE
          MTCONTROLS_APP_VERSION: ${{ needs.prepare.outputs.next_stable }}
        run: cmake --preset windows-release

      - name: Build (Windows)
        run: cmake --build --preset windows-release

      - name: Upload Standalone (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: MTControls-windows-standalone-${{ needs.prepare.outputs.semver }}
          path: build/windows-release/MTControls_artefacts/Release/Standalone
          if-no-files-found: error

  publish:
    name: Tag and publish release
    needs:
      - prepare
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin. Aborting duplicate release." >&2
            exit 1
          fi

      - name: Create and push tag
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MTControls-macos-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MTControls-windows-standalone-${{ needs.prepare.outputs.semver }}
          path: dist/windows

      - name: Package release assets
        shell: bash
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
        run: |
          mkdir -p release-assets
          (cd dist && zip -r "../release-assets/MTControls-macos-standalone-${SEMVER}.zip" macos)
          (cd dist && zip -r "../release-assets/MTControls-windows-standalone-${SEMVER}.zip" windows)

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          SEMVER="${{ needs.prepare.outputs.semver }}"
          gh release create "${TAG}" \
            "release-assets/MTControls-macos-standalone-${SEMVER}.zip" \
            "release-assets/MTControls-windows-standalone-${SEMVER}.zip" \
            --title "${TAG}" \
            --target "${{ needs.prepare.outputs.release_ref }}" \
            --generate-notes
