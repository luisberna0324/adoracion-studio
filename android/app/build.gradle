plugins { id 'com.android.application' }

android {
    namespace 'com.multitracks.playworship'
    compileSdk 36
    ndkVersion '28.1.13356709'

    defaultConfig {
        applicationId 'com.multitracks.playworship'
        minSdk 29
        targetSdk 36
        // Dependency-free native UI/JNI contract harness (debug instrumentation only).
        testInstrumentationRunner 'com.rmsl.juce.NativeLyricsInstrumentation'
        versionCode = (System.getenv('PLAYWORSHIP_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('PLAYWORSHIP_VERSION_NAME') ?: '1.1.4'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-29'
                arguments "-DPLAYWORSHIP_ANDROID_OPTIMIZE_DEBUG=${project.findProperty('playworshipOptimizeDebug') ?: 'ON'}"
                cppFlags '-std=c++17'
            }
        }
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('PLAYWORSHIP_ANDROID_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('PLAYWORSHIP_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('PLAYWORSHIP_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('PLAYWORSHIP_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
